<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="logoGlobeGrad" x1="10" y1="10" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="logoAccentGrad" x1="15" y1="20" x2="75" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Globe Symbol (Scale & Centered around x=50, y=50) -->
  <g transform="translate(10, 10) scale(0.666)">
    <circle cx="60" cy="60" r="48" stroke="url(#logoGlobeGrad)" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="60" cy="60" rx="26" ry="48" stroke="url(#logoGlobeGrad)" stroke-width="4.5" stroke-opacity="0.95"/>
    <line x1="60" y1="12" x2="60" y2="108" stroke="url(#logoGlobeGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 22 40 Q 60 52 98 40" stroke="url(#logoAccentGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 14 60 Q 60 74 106 60" stroke="url(#logoAccentGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 22 80 Q 60 92 98 80" stroke="url(#logoAccentGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="60" cy="60" r="8" fill="#0ea5e9"/>
    <circle cx="60" cy="60" r="3.5" fill="#ffffff"/>
    <circle cx="60" cy="12" r="5" fill="#0284c7"/>
    <circle cx="60" cy="108" r="4" fill="#0284c7"/>
  </g>
  <!-- Typography Wordmark -->
  <text x="110" y="62" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif" font-size="36" font-weight="800" fill="#0f172a" letter-spacing="-0.03em">
    Interview<tspan fill="#0ea5e9">Prep</tspan>
  </text>
  <text x="112" y="80" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.08em" text-transform="uppercase">
    Salary-Wise Career Engineering
  </text>
</svg>
