<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="globeGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="20" y1="30" x2="100" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Outer Globe Boundary -->
  <circle cx="60" cy="60" r="48" stroke="url(#globeGrad)" stroke-width="6" stroke-linecap="round"/>
  <!-- Longitudinal Prime Meridian Ellipse -->
  <ellipse cx="60" cy="60" rx="26" ry="48" stroke="url(#globeGrad)" stroke-width="4.5" stroke-opacity="0.95"/>
  <!-- Central Vertical Axis -->
  <line x1="60" y1="12" x2="60" y2="108" stroke="url(#globeGrad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Latitude Arcs -->
  <path d="M 22 40 Q 60 52 98 40" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 14 60 Q 60 74 106 60" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 22 80 Q 60 92 98 80" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
  <!-- Central Calibration Node -->
  <circle cx="60" cy="60" r="8" fill="#0ea5e9"/>
  <circle cx="60" cy="60" r="3.5" fill="#ffffff"/>
  <!-- Polar Anchor Pins -->
  <circle cx="60" cy="12" r="5" fill="#0284c7"/>
  <circle cx="60" cy="108" r="4" fill="#0284c7"/>
</svg>
